name: PR Benchmark HTTP Comment

on:
  workflow_run:
    workflows: [PR Benchmark HTTP Prepare]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: benchmark-http-comment-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  comment:
    name: Post HTTP benchmark comment
    runs-on: ubuntu-latest
    # Runs for both success and failure of the prepare workflow, so a regression
    # (which makes the prepare job go red) still gets a PR comment.
    if: github.event.workflow_run.event == 'pull_request'

    steps:
      - name: Download benchmark artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          pattern: benchmark-http-pr-*
          merge-multiple: true
          path: benchmark-artifact

      - name: Post or update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");

            const MARKER = "<!-- benchmark-http-pr-comment -->";
            const meta = JSON.parse(fs.readFileSync("benchmark-artifact/benchmark-meta.json", "utf8"));
            const { pr_number: issueNumber, head_sha: artifactHeadSha } = meta;

            if (!issueNumber) return core.setFailed("benchmark-meta.json missing pr_number");
            if (!artifactHeadSha) return core.setFailed("benchmark-meta.json missing head_sha");

            // Bail out if a newer push has already superseded this run.
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: issueNumber,
            });
            if (pr.head.sha !== artifactHeadSha) {
              core.info(`Skipping: artifact SHA ${artifactHeadSha} is not current PR head ${pr.head.sha}`);
              return;
            }

            function readIfExists(path) {
              return fs.existsSync(path) ? fs.readFileSync(path, "utf8") : "";
            }

            let report = readIfExists("benchmark-artifact/report.md").trim();
            if (!report) {
              const log = readIfExists("benchmark-artifact/run.log").trim();
              report = "```text\n" + (log || "No benchmark output was produced.") + "\n```";
            }

            const body = [
              MARKER,
              "## HTTP Benchmark — hello service",
              "",
              report,
              "",
              "_Throughput on GitHub-hosted runners is noisy (~5–15% run-to-run); only large deltas are meaningful. Base and head are measured back-to-back on the same runner (`bal run`), so common-mode noise mostly cancels in the delta. Generated for `origin/<base>` vs `HEAD`._",
            ].join("\n");

            // Upsert: update the existing marker comment or create a new one.
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: issueNumber,
            });
            const existing = comments.find(c => c.body?.includes(MARKER));

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated comment ${existing.id}`);
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issueNumber,
                body,
              });
              core.info("Created HTTP benchmark comment");
            }
