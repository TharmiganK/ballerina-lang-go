name: PR Benchmark HTTP Comment

on:
  workflow_run:
    workflows: [PR Benchmark HTTP Prepare]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: benchmark-http-comment-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  comment:
    name: Post HTTP benchmark comment
    runs-on: ubuntu-latest
    # Runs for both success and failure of the prepare workflow, so a regression
    # (which makes the prepare job go red) still gets a PR comment.
    if: github.event.workflow_run.event == 'pull_request'

    steps:
      # Checks out the default branch (workflow_run always evaluates from
      # there, never the PR head) so the comment script itself stays trusted
      # — script-path needs the file on disk, unlike the old inline script.
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download benchmark artifact
        # Tolerate zero matching artifacts (e.g. prepare failed before upload):
        # download-artifact errors when nothing matches, so don't let that fail
        # the job — the script below degrades gracefully when files are absent.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          pattern: benchmark-http-pr-*
          merge-multiple: true
          path: benchmark-artifact

      - name: Post or update PR comment
        uses: actions/github-script@v7
        with:
          script-path: .github/scripts/post-http-benchmark-comment.js
