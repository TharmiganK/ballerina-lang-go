name: Build on Push

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from'
        required: false
        default: 'main'

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - name: Resolve ref
        id: ref
        run: echo "ref=${{ github.event.inputs.branch || github.ref }}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Get version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

  build:
    name: Build distribution
    needs: version
    uses: ./.github/workflows/build-dist.yml
    with:
      version: ${{ needs.version.outputs.version }}
      ref: ${{ needs.version.outputs.ref }}
    permissions:
      contents: read
