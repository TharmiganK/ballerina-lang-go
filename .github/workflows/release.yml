name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: false
          fetch-depth: 0

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Validate matching module tags
        run: bash .github/scripts/release_dist.sh --check-tags "$GITHUB_REF_NAME" "$GITHUB_SHA"

  build:
    name: Build distribution
    needs: version
    uses: ./.github/workflows/build-dist.yml
    with:
      version: ${{ needs.version.outputs.version }}
      ref: ${{ github.sha }}
    permissions:
      contents: read

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare release files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release
          for artifact_dir in dist/ballerina-nutcracker-*; do
            platform=$(basename "$artifact_dir")
            # Make the binary executable
            find "$artifact_dir" -name "bal*" -type f -exec chmod +x {} \;
            cd "$artifact_dir"
            zip -r "../../release/${platform}-${VERSION}.zip" .
            cd ../..
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
