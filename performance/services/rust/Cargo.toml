[package]
name = "perf-rust"
version = "1.0.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
# No TLS features: the suite is plain HTTP. Default features would pull in a
# TLS stack and response decompression, both off in the shared baseline.
reqwest = { version = "0.12", default-features = false }

[[bin]]
name = "hello"
path = "src/bin/hello.rs"

[[bin]]
name = "passthrough"
path = "src/bin/passthrough.rs"

[profile.release]
lto = true
